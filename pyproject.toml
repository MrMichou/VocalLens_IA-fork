[tool.poetry]
name = "vocallens-ai"
version = "0.4.0"
description = "Meeting transcription and QA system using local Whisper with French support"
authors = ["Your Name <your.email@example.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.8.1,<3.12"
flask = "^2.3.0"
flask-cors = "^4.0.0"
langchain = "0.0.200"
qdrant-client = "1.1.1"
python-dotenv = "0.19.2"
openai-whisper = "*"
torch = "*"
numpy = "*"
werkzeug = "^2.3.0"
sentence-transformers = "*"
transformers = "*"
accelerate = "*"

[tool.poetry.group.dev.dependencies]
pytest = "^7.0"
black = "^23.0"
flake8 = "^6.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
[tool.poetry]
name = "vocallens-ai"
version = "0.5.0"
description = "Meeting transcription and QA system using local Whisper with French support"
authors = ["Your Name <your.email@example.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.10,<3.13"
fastapi = "^0.109.0"
uvicorn = {extras = ["standard"], version = "^0.27.0"}
python-multipart = "^0.0.9"
langchain = "^0.1.0"
qdrant-client = "^1.7.0"
python-dotenv = "^0.21.0"
openai-whisper = "*"
torch = {version = "*", source = "pypi"}
numpy = "*"
sentence-transformers = "*"
transformers = "*"
accelerate = "*"
pydantic = "^2.6.1"
pydantic-settings = "^2.1.0"
httpx = "^0.27.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.0"
pytest-asyncio = "^0.23.0"
black = "^23.0"
flake8 = "^6.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
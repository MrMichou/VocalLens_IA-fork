<!DOCTYPE html>
<html>
<head>
    <title>VocalLens AI</title>
    <style>
        body {
            width: 300px;
            padding: 10px;
            font-family: Arial, sans-serif;
        }
        button {
            width: 100%;
            padding: 10px;
            margin: 5px 0;
            background: #4F46E5;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background: #4338CA;
        }
        button:disabled {
            background: #9CA3AF;
        }
        input {
            width: 100%;
            padding: 8px;
            margin: 5px 0;
            border: 1px solid #D1D5DB;
            border-radius: 4px;
            box-sizing: border-box;
        }
        .answer {
            margin: 10px 0;
            padding: 10px;
            background: #F3F4F6;
            border-radius: 4px;
        }
        .recording {
            background: #EF4444;
        }
    </style>
</head>
<body>
    <button id="recordButton">Start Recording</button>
    <div>
        <input type="text" id="questionInput" placeholder="Ask a question...">
        <button id="askButton">Ask Question</button>
    </div>
    <div id="answers"></div>
    <script src="popup.js"></script>
</body>
</html>
